name: Refresh webmentions snapshot

# Mentions are baked into the site at build time rather than fetched by every
# visitor: one request a day to webmention.io instead of one per page view, the
# section survives their outages, and the committed JSON is a durable copy if
# the service ever disappears.
#
# Daily is deliberate: mentions arrive rarely enough that same-day is fine, and
# the widget dates what it shows. repository_dispatch is kept as an escape hatch
# to force a refresh without waiting for the schedule.
on:
  schedule:
    - cron: '32 5 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Refetch everything instead of only what is new
        type: boolean
        default: false
  repository_dispatch:
    types: [webmention]

permissions:
  contents: write

concurrency:
  group: webmentions-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch mentions
        env:
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
        run: |
          npx webmentions-snapshot \
            --domain rauljimenez.info \
            --out src/data/webmentions.json \
            ${{ inputs.full && '--full' || '' }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/webmentions.json; then
            echo "No change."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/webmentions.json
          git commit -m "chore: refresh webmentions snapshot"
          git push
